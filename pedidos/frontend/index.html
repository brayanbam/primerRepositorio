<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedidos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #acb6e5);
      margin: 0;
      padding: 0;
    }

    .container {
      width: 420px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: #28a745;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-guardar {
      background: #28a745;
      color: white;
    }

    .btn-guardar:hover {
      background: #218838;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: #f9f9f9;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    li:hover {
      background: #eef1f5;
    }

    .acciones button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin-left: 8px;
    }

    .acciones button:hover {
      transform: scale(1.2);
    }

    .mensaje {
      text-align: center;
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

  </style>
</head>

<body>

  <div class="container">
    <h1>📦 Pedidos</h1>

    <div class="form">
      <input type="text" id="nombre" placeholder="Escribe un pedido">
      <button class="btn-guardar" onclick="guardar()">Guardar</button>
    </div>

    <div id="mensaje" class="mensaje"></div>

    <ul id="lista"></ul>
  </div>

  <script>
    function mostrarMensaje(texto) {
      const msg = document.getElementById('mensaje');
      msg.textContent = texto;

      setTimeout(() => {
        msg.textContent = '';
      }, 2000);
    }

    function guardar() {
      const nombre = document.getElementById('nombre').value.trim();

      // ✅ VALIDACIÓN
      if (!nombre) {
        mostrarMensaje("⚠️ Escribe un pedido");
        return;
      }

      fetch('/api/pedidos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre })
      })
      .then(res => res.text())
      .then(() => {
        document.getElementById('nombre').value = '';
        cargar();
      });
    }

    function eliminar(id) {
      if (!confirm("¿Eliminar pedido?")) return;

      fetch('/api/pedidos/' + id, {
        method: 'DELETE'
      })
      .then(() => cargar());
    }

    function editar(id, nombreActual) {
      const nuevo = prompt('Editar pedido:', nombreActual);

      if (nuevo && nuevo.trim() !== '') {
        fetch('/api/pedidos/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: nuevo })
        })
        .then(() => cargar());
      }
    }

    function cargar() {
      fetch('/api/pedidos')
        .then(res => res.json())
        .then(data => {
          const lista = document.getElementById('lista');
          lista.innerHTML = '';

          data.forEach(p => {
            const li = document.createElement('li');

            li.innerHTML = `
              <span>${p.nombre}</span>
              <div class="acciones">
                <button onclick="editar(${p.id}, \`${p.nombre}\`)">✏️</button>
                <button onclick="eliminar(${p.id})">🗑️</button>
              </div>
            `;

            lista.appendChild(li);
          });
        });
    }

    cargar();
  </script>

</body>
</html>
